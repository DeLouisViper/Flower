<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vườn Hoa Của Tôi — Quản lý hoa</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="light">

<!-- ===== HEADER ===== -->
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-mark">🌸</span>
      <span class="brand-name">Vườn Hoa Của Tôi</span>
    </div>

    <div class="search-wrap">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="searchInput" type="text" placeholder="Tìm theo tên hoa..." autocomplete="off" />
      <button id="searchClear" class="search-clear" title="Xoá tìm kiếm" hidden>✕</button>
    </div>

    <div class="topbar-actions">
      <button id="themeToggle" class="icon-btn" title="Đổi giao diện sáng/tối">
        <span class="theme-icon">🌙</span>
      </button>
      <button id="loginBtn" class="btn btn-ghost">Đăng nhập Admin</button>
      <div id="adminBadge" class="admin-badge" hidden>
        <span>👑 Admin</span>
        <button id="logoutBtn" class="btn-link">Đăng xuất</button>
      </div>
      <button id="addFlowerBtn" class="btn btn-gradient">+ Thêm hoa</button>
    </div>
  </div>
</header>

<!-- ===== ADMIN PENDING PANEL ===== -->
<section id="pendingSection" class="pending-section" hidden>
  <div class="container">
    <h2 class="section-title">🕓 Hoa đang chờ duyệt <span id="pendingCount" class="count-pill">0</span></h2>
    <div id="pendingGrid" class="pending-grid"></div>
  </div>
</section>

<!-- ===== MAIN GALLERY ===== -->
<main class="container">
  <div class="gallery-head">
    <h1 id="galleryTitle">Bộ sưu tập hoa</h1>
    <p id="galleryCount" class="muted"></p>
  </div>

  <div id="emptyState" class="empty-state" hidden>
    <div class="empty-emoji">🌱</div>
    <p>Chưa có bông hoa nào ở đây.</p>
    <button class="btn btn-gradient" id="emptyAddBtn">Thêm bông hoa đầu tiên</button>
  </div>

  <div id="flowerGrid" class="flower-grid"></div>
</main>

<footer class="site-footer">
  <p>Được tạo với 🌷 bằng Firebase & GitHub Pages</p>
</footer>

<!-- ===== MODAL: ADD FLOWER ===== -->
<div id="addModal" class="modal-overlay" hidden>
  <div class="modal">
    <button class="modal-close" data-close="addModal">✕</button>
    <h2>Thêm hoa mới</h2>
    <p class="muted small">Hoa của bạn sẽ hiển thị sau khi quản trị viên duyệt.</p>
    <form id="addFlowerForm">
      <label class="field">
        <span>Tên hoa <em>*</em></span>
        <input type="text" id="flowerName" required placeholder="VD: Lan Hồ Điệp" />
      </label>

      <label class="field">
        <span>Phẩm (giống/loại)</span>
        <input type="text" id="flowerVariety" placeholder="VD: Var. Trắng Hồng Tâm" />
      </label>

      <label class="field">
        <span>Người sở hữu <em>*</em></span>
        <input type="text" id="flowerOwners" required placeholder="VD: Minh, Lan, Hùng (cách nhau bằng dấu phẩy)" />
      </label>

      <label class="field">
        <span>Hình ảnh <em>*</em></span>
        <input type="file" id="flowerImage" accept="image/*" required />
        <img id="imagePreview" class="image-preview" hidden />
      </label>

      <div class="form-actions">
        <button type="button" class="btn btn-ghost" data-close="addModal">Huỷ</button>
        <button type="submit" id="submitFlowerBtn" class="btn btn-gradient">Gửi để duyệt</button>
      </div>
      <p id="addFlowerMsg" class="form-msg"></p>
    </form>
  </div>
</div>

<!-- ===== MODAL: FLOWER DETAIL ===== -->
<div id="detailModal" class="modal-overlay" hidden>
  <div class="modal modal-detail">
    <button class="modal-close" data-close="detailModal">✕</button>
    <div id="detailContent"></div>
  </div>
</div>

<!-- ===== MODAL: ADMIN LOGIN ===== -->
<div id="loginModal" class="modal-overlay" hidden>
  <div class="modal modal-narrow">
    <button class="modal-close" data-close="loginModal">✕</button>
    <h2>Đăng nhập Admin</h2>
    <form id="loginForm">
      <label class="field">
        <span>Email</span>
        <input type="email" id="loginEmail" required />
      </label>
      <label class="field">
        <span>Mật khẩu</span>
        <input type="password" id="loginPassword" required />
      </label>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" data-close="loginModal">Huỷ</button>
        <button type="submit" class="btn btn-gradient">Đăng nhập</button>
      </div>
      <p id="loginMsg" class="form-msg"></p>
    </form>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script type="module" src="firebase-config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
